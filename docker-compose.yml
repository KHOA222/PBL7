services:
  video2text:
    build:
      context: ./video2text-service
    ports:
      - "8001:8001"
    environment:
      - USE_REAL_MODEL=0

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/db/video_social.db
      - JWT_SECRET_KEY=change-me
      - VIDEO2TEXT_URL=http://video2text:8001
      - UPLOAD_DIR=uploads
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/db:/app/db
    depends_on:
      - video2text

  frontend:
    build:
      context: ./frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

